[package]
name = "cakeman"
version = "0.1.0"
description = "A no-nonsense package manager for C/C++"
license = "MIT"
repository = "https://github.com/ManiProjs/cakeman.git"
edition = "2024"

[[bin]]
name = "cman"
path = "./src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
dirs = "6.0.0"
oauth2 = "5.0.0"
owo-colors = "4.3.0"
reqwest = { version = "0.13.4", features = ["blocking", "form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
webbrowser = "1.2.2"
